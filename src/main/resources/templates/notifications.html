<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<div class="hf-shell">
    <aside th:replace="~{fragments/layout :: sidebar('notifications')}"></aside>
    <div class="hf-main">
        <header th:replace="~{fragments/layout :: topbar('Notifications','Notifications')}"></header>
        <main class="hf-content">
<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
    <div class="d-flex gap-2">
        <button class="btn btn-hf-soft btn-sm notif-filter active" data-unread="false">All</button>
        <button class="btn btn-hf-ghost btn-sm notif-filter" data-unread="true">Unread</button>
    </div>
    <button class="btn btn-hf-ghost btn-sm" id="markAllRead"><i class="bi bi-check2-all me-1"></i>Mark all read</button>
</div>

<div class="alert alert-info" style="font-size:.82rem">
    <i class="bi bi-info-circle me-1"></i>
    <strong>In-app only.</strong> Notifications are stored in MySQL and appear when you use HabitFlow.
    No email, SMS or browser push is sent, and nothing can reach you while the app is closed —
    a reminder is created the next time you open HabitFlow if one of your habits is due.
</div>

<div class="hf-card">
    <div class="hf-card-head"><div><h2>Your notifications</h2><p id="notifCount">—</p></div></div>
    <div id="notifList">
        <div class="p-3"><div class="hf-skeleton mb-2" style="height:54px"></div><div class="hf-skeleton" style="height:54px"></div></div>
    </div>
</div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/layout :: overlay}"></div>
<th:block th:replace="~{fragments/layout :: scripts('notifications')}"></th:block>
</body>
</html>
