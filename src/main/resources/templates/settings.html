<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Profile & Settings')}"></head>
<body>
<div class="hf-shell">
    <aside th:replace="~{fragments/layout :: sidebar('settings')}"></aside>
    <div class="hf-main">
        <header th:replace="~{fragments/layout :: topbar('Profile & Settings','Settings')}"></header>
        <main class="hf-content">
<div class="row g-3">
    <div class="col-lg-4">
        <div class="hf-card">
            <div class="hf-card-body text-center">
                <div class="hf-avatar mx-auto mb-3" id="settingsAvatar" style="width:72px;height:72px;font-size:1.5rem">AM</div>
                <div style="font-weight:800;font-size:1.05rem" id="settingsName">—</div>
                <div style="font-size:.82rem;color:var(--hf-text-muted)" id="settingsEmail">—</div>
                <div class="hf-chip purple mt-3"><i class="bi bi-shield-check"></i> BCrypt protected account</div>
                <div class="mt-4 pt-3 text-start" style="border-top:1px solid var(--hf-border);font-size:.82rem">
                    <div class="d-flex justify-content-between mb-2"><span style="color:var(--hf-text-muted)">Member since</span>
                        <strong id="settingsSince">—</strong></div>
                    <div class="d-flex justify-content-between"><span style="color:var(--hf-text-muted)">Role</span>
                        <strong id="settingsRole">—</strong></div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-lg-8">
        <div class="hf-card mb-3">
            <div class="hf-card-head"><div><h2>Profile</h2><p>Update your name, email and timezone</p></div></div>
            <div class="hf-card-body">
                <div class="alert d-none py-2" id="profileAlert" style="font-size:.83rem"></div>
                <form id="profileForm" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label" for="profileName">Full name</label>
                            <input class="form-control" id="profileName" maxlength="120" required></div>
                        <div class="col-md-6"><label class="form-label" for="profileEmail">Email address</label>
                            <input class="form-control" type="email" id="profileEmail" required></div>
                        <div class="col-md-6"><label class="form-label" for="profileTimezone">Timezone</label>
                            <input class="form-control" id="profileTimezone" maxlength="60" placeholder="UTC"></div>
                    </div>
                    <button class="btn btn-hf mt-3" type="submit">Save changes</button>
                </form>
            </div>
        </div>

        <div class="hf-card mb-3">
            <div class="hf-card-head"><div><h2>Change password</h2><p>You will be signed out afterwards</p></div></div>
            <div class="hf-card-body">
                <div class="alert d-none py-2" id="passwordAlert" style="font-size:.83rem"></div>
                <form id="passwordForm" novalidate>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label" for="currentPassword">Current password</label>
                            <input class="form-control" type="password" id="currentPassword" autocomplete="current-password" required></div>
                        <div class="col-md-4"><label class="form-label" for="newPassword">New password</label>
                            <input class="form-control" type="password" id="newPassword" autocomplete="new-password" required></div>
                        <div class="col-md-4"><label class="form-label" for="confirmNewPassword">Confirm new password</label>
                            <input class="form-control" type="password" id="confirmNewPassword" autocomplete="new-password" required></div>
                    </div>
                    <div class="form-text mt-2">Minimum 8 characters, with at least one letter and one number.</div>
                    <button class="btn btn-hf mt-3" type="submit">Update password</button>
                </form>
            </div>
        </div>

        <div class="hf-card">
            <div class="hf-card-head"><div><h2>Danger zone</h2><p>Session and account controls</p></div></div>
            <div class="hf-card-body d-flex flex-wrap gap-2">
                <button class="btn btn-hf-ghost btn-sm" data-logout><i class="bi bi-box-arrow-right me-1"></i>Sign out of this device</button>
                <a class="btn btn-hf-ghost btn-sm" th:href="@{/analytics}"><i class="bi bi-download me-1"></i>View report</a>
            </div>
        </div>
    </div>
</div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/layout :: overlay}"></div>
<th:block th:replace="~{fragments/layout :: scripts('settings')}"></th:block>
</body>
</html>
