<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Calendar & History')}"></head>
<body>
<div class="hf-shell">
    <aside th:replace="~{fragments/layout :: sidebar('calendar')}"></aside>
    <div class="hf-main">
        <header th:replace="~{fragments/layout :: topbar('Calendar & History','Calendar')}"></header>
        <main class="hf-content">
<div class="row g-3 mb-3">
    <div class="col-lg-8">
        <div class="hf-card">
            <div class="hf-card-body d-flex flex-wrap align-items-center gap-2">
                <button class="hf-icon-btn" id="prevMonth"><i class="bi bi-chevron-left"></i></button>
                <div class="flex-grow-1 text-center">
                    <div style="font-weight:800;font-size:1.05rem" id="calLabel">Month</div>
                    <div style="font-size:.77rem;color:var(--hf-text-muted)" id="calRange">—</div>
                </div>
                <button class="hf-icon-btn" id="nextMonth"><i class="bi bi-chevron-right"></i></button>
                <button class="btn btn-hf-ghost btn-sm" id="calToday">Today</button>
                <select class="form-select form-select-sm" id="calHabitFilter" style="max-width:200px">
                    <option value="">All habits</option>
                </select>
            </div>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="hf-card h-100">
            <div class="hf-card-body d-flex justify-content-between align-items-center">
                <div><div class="hf-stat-label">This month</div>
                    <div class="hf-stat-value" style="font-size:1.4rem" id="calMonthRate">—</div>
                    <div class="hf-stat-note" id="calMonthDetail">0 of 0 sessions</div></div>
                <div class="hf-stat-icon" style="--accent:#14B8A6;--accent-soft:#E6FBF8">
                    <i class="bi bi-calendar-check"></i></div>
            </div>
        </div>
    </div>
</div>

<div class="row g-3">
    <div class="col-lg-8">
        <div class="hf-card">
            <div class="hf-card-body">
                <div class="hf-cal-grid mb-2">
                    <div class="hf-cal-dow">Mon</div><div class="hf-cal-dow">Tue</div><div class="hf-cal-dow">Wed</div>
                    <div class="hf-cal-dow">Thu</div><div class="hf-cal-dow">Fri</div><div class="hf-cal-dow">Sat</div>
                    <div class="hf-cal-dow">Sun</div>
                </div>
                <div class="hf-cal-grid" id="calGrid">
                    <div class="hf-skeleton" style="height:62px"></div>
                </div>
                <div class="d-flex flex-wrap gap-3 mt-3" style="font-size:.76rem;color:var(--hf-text-muted)">
                    <span><span class="hf-cal-dot" style="background:#B9E9E1;width:10px;height:10px;display:inline-block;border-radius:3px"></span> All done</span>
                    <span><span class="hf-cal-dot" style="background:#F5E2BC;width:10px;height:10px;display:inline-block;border-radius:3px"></span> Partial</span>
                    <span><span class="hf-cal-dot" style="background:#FBDADA;width:10px;height:10px;display:inline-block;border-radius:3px"></span> Missed</span>
                    <span><span class="hf-cal-dot" style="background:#EEF0F8;width:10px;height:10px;display:inline-block;border-radius:3px"></span> Nothing scheduled</span>
                </div>
            </div>
        </div>
    </div>
    <div class="col-lg-4">
        <div class="hf-card h-100">
            <div class="hf-card-head"><div><h2 id="calDetailTitle">Select a day</h2><p id="calDetailSub">Tap any date</p></div></div>
            <div class="hf-card-body" id="calDetail">
                <div class="hf-empty"><div class="hf-empty-icon"><i class="bi bi-calendar3"></i></div>
                    <h4>No day selected</h4><p>Choose a date to see what was scheduled and completed.</p></div>
            </div>
        </div>
    </div>
</div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/layout :: overlay}"></div>
<th:block th:replace="~{fragments/layout :: scripts('calendar')}"></th:block>
</body>
</html>
