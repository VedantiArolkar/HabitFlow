# =====================================================================
# HabitFlow - main configuration
# Credentials come from environment variables; never commit real secrets.
# =====================================================================
spring.application.name=HabitFlow

# ---- MySQL -----------------------------------------------------------------
spring.datasource.url=${HABITFLOW_DB_URL:jdbc:mysql://localhost:3306/habitflow_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${HABITFLOW_DB_USER:root}
spring.datasource.password=${HABITFLOW_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Small Hikari pool is plenty for a single-user local demo
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000

# ---- Schema bootstrap ------------------------------------------------------
# Tables are created if missing (idempotent). Turn off in production and run
# database/schema.sql manually instead.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=false

# ---- Server ----------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ---- Thymeleaf -------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ---- Jackson ---------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ---- App specific ----------------------------------------------------------
# Seeds the demo account + 60 days of history so the UI and charts are not empty.
# Set HABITFLOW_SEED_DEMO=false for a clean install.
app.seed-demo-data=${HABITFLOW_SEED_DEMO:true}
app.demo-email=${HABITFLOW_DEMO_EMAIL:demo@habitflow.app}
app.demo-password=${HABITFLOW_DEMO_PASSWORD:Demo@12345}
